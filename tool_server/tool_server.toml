# tool_server.toml

[server]
bind_address = "127.0.0.1:9000"
auth_token = "123456"

[tavily]
url = "https://api.tavily.com/search"
api_key = ""

[oracle]
provider = "openai_compatible"
url = "https://api.openai.com/v1/chat/completions"
model = "gpt-4.1"
api_key = ""
temperature = 0.3
max_tokens = 4096

[global]
allowed_tools = ["web_search"]

[instances.default]
allowed_tools = ["echo_message", "oracle"]

[mcp]
enabled = false

[mcp.servers]
command = "npx"
args = ["tsx", ""]

[mcp.servers.env]
